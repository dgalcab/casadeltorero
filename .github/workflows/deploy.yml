name: Deploy theme to deploy branch

on:
  push:
    branches:
      - claude/stoic-heisenberg-qFK19

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push theme files to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash theme files from source branch
          git checkout origin/claude/stoic-heisenberg-qFK19 -- .

          # Create or switch to deploy branch
          git fetch origin deploy 2>/dev/null && git checkout deploy || git checkout --orphan deploy

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Checkout theme files from source branch into deploy
          git checkout origin/claude/stoic-heisenberg-qFK19 -- .

          git add -A
          git commit -m "deploy: sync from claude/stoic-heisenberg-qFK19 $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push origin deploy --force
